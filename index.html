<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clínica Amigo Pet</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header>
    <h1>Clínica Veterinária Amigo Pet</h1>
  </header>

  <main>
    <section class="cartao">
      <h2>Agendamento de Consulta</h2>

      <img class="foto-destaque"
           src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b?w=400"
           alt="Dois cachorros correndo lado a lado em uma estrada de terra, ao pôr do sol: um corgi caramelo e branco, de boca aberta, e um cão peludo de pelagem clara e acinzentada.">

      <p>Cuide da saúde do seu melhor amigo com carinho.</p>

      <form action="#" method="post">

        <div class="campo">
          <label for="nome">Nome do Tutor:</label>
          <input type="text" id="nome" name="nome" required minlength="3"
                 aria-describedby="ajuda-nome">
          <small id="ajuda-nome">Digite o nome completo do responsável.</small>
        </div>

        <div class="campo">
          <label for="email">E-mail para Contato:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <fieldset>
          <legend>Espécie do Animal:</legend>
          <input type="radio" id="cachorro" name="especie" value="cachorro">
          <label for="cachorro">Cachorro</label>

          <input type="radio" id="gato" name="especie" value="gato">
          <label for="gato">Gato</label>

          <input type="radio" id="bebe-diabo" name="especie" value="bebe-diabo">
          <label for="gato">Bebê-Diabo</label>
        </fieldset>

        <fieldset>
          <legend>Serviços Desejados:</legend>
          <input type="checkbox" id="vacinacao" name="servicos" value="vacinacao">
          <label for="vacinacao">Vacinação</label>

          <input type="checkbox" id="banho-tosa" name="servicos" value="banho-tosa">
          <label for="banho-tosa">Banho e Tosa</label>

          <input type="checkbox" id="exorcismo" name="servicos" value="exorcismo">
          <label for="banho-tosa">Exorcismo</label>
        </fieldset>

        <button type="submit"
                aria-label="Confirmar agendamento da consulta veterinária">Agendar Consulta</button>
      </form>
    </section>
  </main>

  <footer>
    <p>Clínica Amigo Pet - Atendimento Acessível 2026</p>
  </footer>

</body>
</html>
